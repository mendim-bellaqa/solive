[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Pinned so the build doesn't drift onto whatever default Node the site was
  # created with. Next 14 and the Supabase SDK both want a current LTS.
  NODE_VERSION = "20"

# Next.js on Netlify is handled by the official runtime.
[[plugins]]
  package = "@netlify/plugin-nextjs"
